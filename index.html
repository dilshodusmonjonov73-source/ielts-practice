<script>
const R=[
{title:"The Quiet Return of the Night Train",level:"Medium",paras:[
"For much of the twentieth century, sleeper trains were a normal way to travel across Europe. Passengers boarded in the evening, slept in narrow bunks and arrived in another country by breakfast. From the 1990s, however, the arrival of cheap airlines and high-speed daytime rail made overnight services look old-fashioned. Operators cut routes one by one, and by 2010 many famous connections had disappeared. Railway companies argued that the carriages were expensive to maintain and that too few travellers were willing to pay for a bed.",
"Interest has recently revived, partly because of growing concern about carbon emissions. A journey by train typically produces far less carbon dioxide per passenger than the same trip by plane. In 2019 a campaign in Sweden encouraged people to avoid flying for environmental reasons, and surveys in several countries showed a rise in travellers who said they would consider rail for trips under 1,500 kilometres. Some governments responded by offering financial support to companies willing to restart sleeper routes.",
"Reviving night trains is not simple, however. Much of the rolling stock built in the 1970s is now too old to use, and few factories produce new sleeper carriages. Border crossings add further difficulty, because countries still use different signalling systems and safety rules. A train travelling from Vienna to Brussels, for example, must meet the requirements of several national authorities. One Austrian company overcame this by ordering carriages that can operate under all of the relevant systems, although the investment cost more than the company had first predicted.",
"The experience offered on board has also changed. Older sleepers often had shared compartments with six beds, which many passengers found uncomfortable. New services provide private cabins, some with their own shower, and in certain cases a small number of seats at lower prices. Marketing now focuses on the idea that the journey itself is part of the holiday rather than lost time. Passengers who were interviewed on one route said that they valued the chance to work in the evening and wake up already in the city centre.",
"Not everyone is convinced that night trains can become widespread. Transport economists point out that tickets on popular routes are still often more expensive than budget flights, which limits their appeal to families and students. Even so, several operators report that their beds sell out weeks in advance, and a few are planning further routes for the end of the decade. Whether this growth continues may depend on how much public money is available, since few sleeper services currently make a profit without help."],
qs:[
{q:"Sleeper trains were used mainly by business travellers during the twentieth century.",a:"NG",ev:"sleeper trains were a normal way to travel across Europe"},
{q:"Railway companies believed that not enough people would be prepared to pay for a bed.",a:"T",ev:"too few travellers were willing to pay for a bed"},
{q:"Rail travel usually causes less carbon dioxide per passenger than flying the same route.",a:"T",ev:"A journey by train typically produces far less carbon dioxide per passenger than the same trip by plane"},
{q:"Surveys found that travellers in several countries were becoming less willing to consider rail for journeys of moderate length.",a:"F",ev:"surveys in several countries showed a rise in travellers who said they would consider rail for trips under 1,500 kilometres"},
{q:"Most carriages built in the 1970s can still be used on modern routes.",a:"F",ev:"Much of the rolling stock built in the 1970s is now too old to use"},
{q:"The Austrian company spent more on new carriages than it had originally expected.",a:"T",ev:"the investment cost more than the company had first predicted"},
{q:"Private cabins on new services cost twice as much as shared compartments used to.",a:"NG",ev:"New services provide private cabins, some with their own shower"},
{q:"Passengers interviewed on one route liked the journey because they could avoid doing any work.",a:"F",ev:"valued the chance to work in the evening"},
{q:"Transport economists believe that night train tickets on popular routes are now cheaper than budget flights.",a:"F",ev:"tickets on popular routes are still often more expensive than budget flights"},
{q:"Several operators plan to introduce daytime services as well.",a:"NG",ev:"a few are planning further routes for the end of the decade"}],
vocab:[["revive","qayta jonlanmoq","Interest in rail has recently revived."],["emissions","(zararli gaz) chiqindilar","Planes produce more emissions than trains."],["rolling stock","temir yo'l tarkibi (vagonlar)","The rolling stock was too old to use."],["bunk","ikki qavatli yotoq","Passengers slept in narrow bunks."],["compartment","kupe","Six people shared one compartment."],["investment","sarmoya","The investment cost more than expected."],["appeal","jozibadorlik","High prices limit the appeal of night trains."],["profit","foyda","Few services make a profit without help."]]},
{title:"Why Forgetting Helps Us Learn",level:"Medium",paras:[
"Most people regard forgetting as a failure of the brain. We lose keys, struggle to recall names and cannot remember what we studied last week. Yet psychologists increasingly argue that forgetting is not a flaw but a feature. In 1885 the German researcher Hermann Ebbinghaus tested himself on lists of meaningless syllables and found that most of what he had learned disappeared within a day. The loss was fastest at the beginning and then slowed down, a pattern that later became known as the forgetting curve.",
"Later studies suggested that the brain removes information on purpose. A memory that is never needed again takes up space and may even interfere with more useful knowledge. For example, if you move to a new house, remembering your old phone number or address could make it harder to retrieve the new one. Researchers have found that the brain actively weakens competing memories so that the correct answer can be recalled more quickly. They described this as a kind of mental housekeeping.",
"Forgetting also affects how well we learn. Experiments show that students who test themselves after a delay remember more in the long term than those who reread notes several times in a row. The reason is that the effort of retrieving a half-forgotten fact strengthens the memory far more than seeing it again. Teachers sometimes call this a 'desirable difficulty'. Surprisingly, learners often feel that rereading is more effective, because the material looks familiar, even though their test results are lower.",
"Sleep plays an important part in deciding what is kept. During deep sleep the brain replays the events of the day and appears to select the ones that are most meaningful, particularly those linked to strong emotion or to existing knowledge. In one study, volunteers who slept after learning a set of word pairs recalled more of them the following morning than those who stayed awake. Less important details, such as the colour of a stranger's coat, were more likely to be dropped.",
"There are, however, cases in which forgetting becomes a serious problem. Some conditions, such as Alzheimer's disease, damage the parts of the brain responsible for creating new memories. At the other extreme, a very small number of people can recall almost every day of their lives in detail, yet many of them describe the ability as exhausting rather than useful. Scientists believe that these cases support the view that a healthy memory depends on a balance between remembering and letting go."],
qs:[
{q:"In his experiments, Ebbinghaus used lists of words that had real meaning.",a:"F",ev:"lists of meaningless syllables"},
{q:"Ebbinghaus found that most memory loss occurred soon after learning.",a:"T",ev:"The loss was fastest at the beginning"},
{q:"Memories that are no longer used may make it harder to reach more important knowledge.",a:"T",ev:"may even interfere with more useful knowledge"},
{q:"People who change address usually forget their old one easily.",a:"NG",ev:"remembering your old phone number or address could make it harder to retrieve the new one"},
{q:"Rereading notes several times produces better long-term results than testing yourself after a delay.",a:"F",ev:"students who test themselves after a delay remember more in the long term than those who reread notes several times in a row"},
{q:"Learners often believe that rereading is more effective than self-testing.",a:"T",ev:"learners often feel that rereading is more effective"},
{q:"In the study, the group that stayed awake remembered more word pairs than the group that slept.",a:"F",ev:"volunteers who slept after learning a set of word pairs recalled more of them the following morning than those who stayed awake"},
{q:"Dreaming is the main way in which the brain decides which memories to keep.",a:"NG",ev:"During deep sleep the brain replays the events of the day"},
{q:"Alzheimer's disease is more common among people who sleep badly.",a:"NG",ev:"Some conditions, such as Alzheimer's disease, damage the parts of the brain responsible for creating new memories"},
{q:"People with extremely detailed memories generally find their ability useful.",a:"F",ev:"many of them describe the ability as exhausting rather than useful"}],
vocab:[["flaw","kamchilik","Forgetting is not a flaw but a feature."],["interfere","xalaqit bermoq","Old facts can interfere with new ones."],["retrieve","(xotiradan) qayta olmoq","It is hard to retrieve the new number."],["desirable","maqbul, foydali","A desirable difficulty improves learning."],["meaningful","mazmunli","The brain keeps meaningful events."],["exhausting","charchatuvchi","Perfect memory can be exhausting."],["existing","mavjud","Memories linked to existing knowledge last longer."],["balance","muvozanat","Memory needs a balance."]]}
];
const BT=[[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[7,3.5]];
const band=r=>{for(const[m,b]of BT)if(r>=m)return b;return 3};
const $=s=>document.querySelector(s),A=$('#app'),LB={T:'True',F:'False',NG:'Not Given'};
const st={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
let S={};
function home(){
 const u=st.get('u',{n:0,best:0,streak:0,last:''}),W=R.flatMap(r=>r.vocab),w=W[new Date().getDate()%W.length];
 A.innerHTML=`<div class="hero"><h1>IELTS Reading<br>Challenge</h1><p>Kuniga bitta passage. Har xatodan o'rganing, har kuni band balingiz o'sadi.</p><div class="chips"><span>🔥 ${u.streak} kun ketma-ket</span><span>✅ ${u.n} ta test</span><span>🏆 Band ${u.best||'—'}</span></div></div>
 <div class="wrap"><div class="cards"><a class="big" onclick="listScr()"><b>📖 Reading</b><small>${R.length} ta passage · imtihon va oddiy rejim</small></a><a class="big" href="365-magazine-nov-2025.pdf" target="_blank"><b>📰 Article</b><small>365 Magazine, November 2025</small></a></div>
 <div class="card" onclick="vocab()" style="cursor:pointer"><p class="tag">Kun so'zi · flashcardga o'tish</p><h3>${w[0]}</h3><div>${w[1]}</div><i style="color:var(--mu)">${w[2]}</i></div></div>`}
function listScr(){
 A.innerHTML=`<div class="wrap"><button class="lk" onclick="home()">← Bosh sahifa</button><h2>Reading</h2>
 <div class="card"><h3>⏱ Imtihon rejimi</h3><p>${Math.min(3,R.length)} ta passage, 60 daqiqa. Vaqtni o'zgartirib bo'lmaydi.</p><button class="btn" onclick="startT([...R].sort(()=>Math.random()-.5).slice(0,3),true)">Imtihonni boshlash</button></div>
 <div class="card"><h3>🎯 Oddiy rejim</h3><p>Xohlagan passage'larni belgilang. Vaqt cheklanmagan.</p>
 ${R.map((r,i)=>`<label class="row"><input type="checkbox" class="pk" value="${i}" ${i==0?'checked':''}><span><b>${i+1}. ${r.title}</b><small>${r.level} · ${r.qs.length} savol</small></span></label>`).join('')}
 <button class="btn" onclick="startP()">Boshlash</button></div><button class="btn alt" onclick="vocab()">🃏 Lug'at va flashcard</button></div>`}
function startP(){const p=[...document.querySelectorAll('.pk:checked')].map(c=>R[+c.value]);if(p.length)startT(p,false)}
function startT(ps,ex){clearInterval(S.iv);let n=0;S={ps,ex,ans:{},tab:0,t:ex?3600:0,off:ps.map(p=>{const o=n;n+=p.qs.length;return o}),total:n,done:false};draw();S.iv=setInterval(()=>{S.t+=ex?-1:1;if(ex&&S.t<=0)return finish();const e=$('#tm');if(e)e.textContent=fmt(S.t)},1000)}
function pass(i){const p=S.ps[i];return`<h2 style="text-align:center">${p.title}</h2>`+p.paras.map(t=>{let h=t;if(S.done)p.qs.forEach((q,j)=>{if(h.includes(q.ev))h=h.replace(q.ev,`<mark id="ev${S.off[i]+j+1}">${q.ev}</mark>`)});return h}).map((h,k)=>`<p><span class="pm">${'ABCDE'[k]}</span>${h}</p>`).join('')}
function qsHtml(i){const p=S.ps[i],o=S.off[i];return`<div class="rub"><b>Questions ${o+1}–${o+p.qs.length}</b><br>Do the following statements agree with the information given in the passage? Choose <b>TRUE</b> if the statement agrees, <b>FALSE</b> if it contradicts, <b>NOT GIVEN</b> if there is no information on this.</div>`+p.qs.map((q,j)=>{const g=o+j+1,u=S.ans[g],ok=u===q.a;
 const opts=['T','F','NG'].map(v=>`<label><input type="radio" name="q${g}" value="${v}" ${u===v?'checked':''} ${S.done?'disabled':''} onchange="S.ans[${g}]=this.value"> ${LB[v]}</label>`).join('');
 const ex=S.done?`<div class="ev">Sizning javobingiz: <b>${u?LB[u]:'—'}</b> · To'g'ri: <b>${LB[q.a]}</b><br>${q.a==='NG'?"Matnda bu haqda aniq ma'lumot yo'q. Eng yaqin jumla belgilangan: ":"Dalil: "}<a onclick="jump(${g})">matnda ko'rish ↖</a></div>`:'';
 return`<div class="q ${S.done?(ok?'ok':'bad'):''}"><span class="nb">${g}</span>${q.q}<div>${opts}</div>${ex}</div>`}).join('')}
function sum(){const W=S.ps.flatMap(p=>p.vocab);return`<div class="card"><p class="tag">Natija</p><p class="bandn">Band ${S.band.toFixed(1)}</p><p><b>${S.sc}/${S.total}</b> to'g'ri. Xato savollar qizil, matndagi dalil sariq bilan belgilangan.</p><button class="btn" onclick="listScr()">Boshqa test</button><button class="btn alt" onclick="vocab()">🃏 Lug'at</button><details><summary>Shu testdagi muhim so'zlar</summary>${W.map(w=>`<div><b>${w[0]}</b> — ${w[1]}</div>`).join('')}</details></div>`}
function draw(){const i=S.tab;A.innerHTML=`<div class="top"><button class="lk" onclick="quit()">←</button><b>${S.done?'Tahlil':S.ex?'Imtihon':'Mashq'}</b><span id="tm" class="tm">${S.done?S.band.toFixed(1):fmt(S.t)}</span></div>
<div class="tabs">${S.ps.map((_,k)=>`<button class="${k==i?'on':''}" onclick="S.tab=${k};draw()">Passage ${k+1}</button>`).join('')}</div>
<div class="tc"><div class="pc" id="pc">${pass(i)}</div><div class="dv" id="dv"></div><div class="qc">${S.done?sum():''}${qsHtml(i)}${S.done?'':'<button class="btn" onclick="finish()">Yakunlash</button>'}</div></div>`;
 const d=$('#dv'),pc=$('#pc');d.onpointerdown=e=>{d.setPointerCapture(e.pointerId);d.onpointermove=m=>{const r=pc.parentNode.getBoundingClientRect();pc.style.width=Math.min(75,Math.max(25,(m.clientX-r.left)/r.width*100))+'%'}};d.onpointerup=()=>d.onpointermove=null}

ARTS.unshift({title:"The Case for Healthy Selfishness",level:"Easy",paras:["Most of us grow up hearing that good people share, give way and put others first. These lessons matter, because they teach us to live alongside other people. The problem begins when they harden into a rule that our own needs must always come last. People who follow this rule rarely feel generous; more often they feel tired and quietly resentful.","Psychologists therefore separate two ideas that sound alike. Harmful selfishness ignores other people's feelings completely. Healthy selfishness simply means noticing what you need and being willing to protect it. Someone who says no to an extra commitment is not being cold; they are making sure that they still have the energy to do their existing commitments well.","Consider the common situation of agreeing to a favour you do not have time for. You arrive late, you worry about the work you have left undone, and the person you wanted to help senses your stress. Everyone ends up with a worse experience than an honest refusal would have caused. Often the real reason for saying yes is not kindness but a fear of being disliked.","Learning to set boundaries is a skill, and it can begin with small steps: pausing before you answer a request, offering a smaller alternative, or scheduling rest as seriously as any meeting. Those who practise this usually find that their relationships survive, and that the people around them benefit from a calmer, more reliable version of them."],vocab:[["resentful","ranjigan, ichida g'ashi bor","He felt resentful about the extra work."],["boundary","chegara","Set a boundary and keep to it."],["reliable","ishonchli","She is a reliable colleague."],["commitment","majburiyat","I have too many commitments this week."]]},{title:"Why We Feel Close to People on Screen",level:"Easy",paras:["Have you ever felt that a television presenter, a streamer or a character in a series was a kind of friend? If so, you have experienced what researchers call a parasocial relationship: a one-sided bond in which one person feels connected to another who does not know they exist.","The term was introduced in 1956 by two American sociologists, Donald Horton and Richard Wohl, who were studying the first generation of television viewers. They noticed that presenters spoke directly to the camera and behaved as if they were talking to a guest in the room, which encouraged viewers to respond as they would to a real acquaintance.","Social media has made the effect stronger. Influencers share everyday moments, answer comments and appear in our pockets many times a day, so the feeling of closeness can become very intense. For many people, these connections are harmless and even comforting, especially when they are lonely or tired.","Problems appear when the bond replaces real contact, or when constant comparison with other people's polished lives leaves us feeling worse about our own. A sensible approach is to enjoy such content while keeping time for real friends, hobbies and clubs, where the relationship works in both directions."],vocab:[["parasocial","bir tomonlama (ekrandagi odamga bog'lanish)","A parasocial bond is one-sided."],["acquaintance","tanish","He is an acquaintance, not a close friend."],["intense","kuchli","The feeling can be very intense."],["comparison","taqqoslash","Constant comparison makes people unhappy."]]});

ARTS.push({title:"The Case for Healthy Selfishness",level:"Medium",paras:[
"From early childhood, most of us are taught a simple set of rules: share your toys, wait your turn, think about how other people feel. These lessons are valuable, and a society without them would be a hard place to live. Yet somewhere between the playground and adult life, many people quietly turn kindness into a rule that admits no exceptions. Their own needs are always last, and they begin to believe that this is what being a good person looks like.",
"The cost of that belief tends to arrive slowly. At first a person who always says yes is thanked, admired and relied upon. Over time, however, the calendar fills, rest disappears and a low-level resentment starts to grow. Psychologists who study stress note that chronic overcommitment is one of the most common routes to exhaustion, because the body and mind never receive a signal that it is safe to stop.",
"It helps to separate two ideas that are often confused. Harmful selfishness means ignoring other people's feelings and taking what you want regardless of the consequences. Healthy selfishness means something far smaller: noticing what you need, whether it is sleep, time alone or an hour to finish your own work, and being willing to protect it. The first damages relationships; the second often saves them.",
"Imagine a friend who asks you to go shopping on a day when you have a deadline. If you agree out of guilt, the afternoon rarely goes well. You check the time, you answer messages on your phone and you become quietly irritable, while your friend senses that something is wrong. Both of you leave feeling worse than if you had simply said, 'I can't today, but let's go on Saturday.' An honest refusal would have cost a moment of awkwardness and bought a better friendship.",
"Behind many automatic yeses lies a deeper motive. People-pleasing is frequently driven not by generosity but by a wish to be approved of, or by an old fear that disappointing others will lead to rejection. Recognising this pattern is uncomfortable, but it is also freeing, because it shows that the problem is not a lack of kindness. It is a lack of practice in tolerating another person's brief disappointment.",
"Parents often feel this pressure most strongly. A mother or father who never rests may believe that they are giving everything to their children, yet exhausted adults are usually less patient, less playful and less attentive. A short walk, a long bath or an evening with friends is not an escape from family life; it restores the energy that family life requires. Children benefit far more from a relaxed parent than from a perfect but depleted one.",
"Setting boundaries is a skill that grows with practice. Start with small situations: pause before answering a request, ask for time to check your diary, or offer a smaller version of what was asked. Notice that most relationships survive these moments with ease. In the end, caring for yourself and caring for others are not opposites. The first is often the foundation that makes the second possible."]},
{title:"Why We Feel Close to People on Screen",level:"Medium",paras:[
"Imagine finishing a long day, switching on the television and hearing a familiar presenter greet you as if you were an old friend. Millions of people have this experience every evening, and most never stop to think about it. Researchers have a name for the bond: a parasocial relationship. It is a connection that feels mutual to one side, even though the other person has no idea that the viewer exists.",
"The idea is older than the internet. In 1956 two American sociologists, Donald Horton and Richard Wohl, studied the new world of television and noticed something unusual. Presenters looked straight into the camera, used first names and spoke as if the audience were sitting in the same room. Viewers responded by treating these figures as familiar acquaintances, and the sociologists called the effect 'parasocial interaction'.",
"Television still creates this feeling, but its power depends on small details. A talk show set designed like a living room, a warm tone of voice, and a presenter who appears at the same time every week all encourage a sense of routine and belonging. The viewer begins to feel part of a circle of friends, even though the circle exists only on the screen. Fictional characters can work in a similar way, particularly for people who have followed them through several series.",
"Social media has pushed the experience further. Influencers share breakfasts, holidays and bad days, and they often reply to comments, which gives followers the thrilling impression that they have been noticed. Because this happens on the same phone that people use to message their real friends, the line between the two kinds of connection becomes blurred. Many scholars regard this as a new form of micro-celebrity.",
"There are real benefits. For someone who is lonely, shy or living far from home, a favourite programme can offer comfort and a sense of company. Watching a character cope with a difficult situation may even help viewers think about their own problems more calmly. Researchers generally agree that these bonds are not unhealthy in themselves, and that they meet a very human need to feel connected.",
"Problems begin when the relationship is treated as a replacement for real life. Because the connection is one-sided, the star cannot offer support in return, and a viewer who invests too much time or money may feel disappointed or even obsessed. Constant exposure to perfect homes and carefully edited lives can also encourage comparison, which tends to damage self-esteem and make ordinary life feel dull.",
"A balanced approach is possible. Enjoy the programmes and creators you like, but keep a firm boundary around how much time they take. Notice small pleasures that belong only to you, such as reading, gardening or cooking, and make space for activities where other people can answer back, like a book club or a sports team. Parasocial bonds can be a pleasant addition to life, as long as they never become the whole of it."]},
{title:"Why Walking Meetings Work",level:"Medium",paras:[
"In most offices, important conversations still happen around a table. Chairs are arranged, a screen is switched on, and everyone settles in for an hour. A growing number of companies, however, are asking whether this habit is really the best way to think together. Their alternative is simple: take the discussion outside and walk while you talk.",
"The idea is hardly new. The ancient Greek philosopher Aristotle is said to have taught his students while strolling around the grounds of his school, and many writers and scientists have since described walking as the moment when their best ideas arrived. What has changed is that researchers now have the tools to measure the effect rather than merely admire it.",
"In one well-known experiment at a US university, volunteers were asked to complete creative tasks, such as thinking of unusual uses for everyday objects. Some did the task sitting down and others while walking. On average, the walkers produced about 60 per cent more ideas. The improvement appeared even when people walked on a treadmill facing a blank wall, which suggests that the movement itself, rather than the scenery, was responsible.",
"Walking can also change the atmosphere of a discussion. Managers who have tried walking meetings report that quieter colleagues speak more freely when they are not facing their seniors across a table. Walking side by side removes eye contact, which many people find less intimidating. Without screens to watch, participants also tend to listen more carefully, although taking detailed notes becomes harder.",
"There are, however, practical limits. Walking meetings work best with two or three people, because larger groups find it difficult to hear one another. Bad weather, traffic noise and the need to discuss confidential information can make a walk unsuitable. Some employees with health problems may feel excluded unless a slower route, or a seated alternative, is offered.",
"Experts therefore recommend using walking meetings for particular purposes rather than replacing every conference. Topics that need fresh ideas, such as planning a project or solving a stubborn problem, seem to suit them well. One-to-one conversations about career progress or personal concerns also benefit from the relaxed setting. Detailed financial discussions, which depend on documents and figures, are better handled at a desk.",
"Organisations that want to try the idea can begin modestly. Choose a short, familiar route of around twenty minutes, agree on the topic in advance, and leave a few minutes at the end to write down decisions. Many teams find that after a few attempts the walk becomes the part of the week that people look forward to most."]});
